<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MailFlow</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body class="app">
<aside class="sidebar" id="sidebar" aria-label="Views and mailboxes">
  <div class="side-top">
    <span class="brand"><span class="mark" aria-hidden="true">M</span><span class="brand-name">MailFlow</span></span>
    <button id="collapse" class="icon-btn collapse-btn" type="button" title="Collapse the sidebar  [" aria-label="Collapse the sidebar"></button>
  </div>
  <label class="search">
    <span class="search-icon" aria-hidden="true"></span>
    <input id="search" type="search" placeholder="Search" aria-label="Search the list" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">/</kbd>
  </label>
  <nav id="nav"></nav>
  <div class="side-foot">
    <button id="sync" class="sync" type="button" title="Refresh now"></button>
    <button id="user-btn" class="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu"></button>
    <div id="user-menu" class="menu" role="menu" hidden>
      <button id="open-users" type="button" role="menuitem" data-icon="users" hidden>Manage users</button>
      <button id="open-password" type="button" role="menuitem" data-icon="key">Change password</button>
      <hr>
      <button id="logout" type="button" role="menuitem" data-icon="logout">Sign out</button>
    </div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main class="panes" id="panes">
  <section class="list" id="list" aria-label="Emails"></section>
  <section class="detail" id="detail" aria-label="Open email"></section>
</main>

<p id="toast" class="toast" role="status" hidden></p>

<dialog id="password-dialog">
  <form id="password-form" method="dialog">
    <h2>Change password</h2>
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password (at least 12 characters) <input type="password" name="new" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input type="password" name="again" autocomplete="new-password" minlength="12" required></label>
    <p class="error" role="alert" hidden></p>
    <div class="row-buttons">
      <button type="submit" class="btn primary" value="save">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="users-dialog">
  <div class="dialog-body">
    <h2>Users</h2>
    <table class="users">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody id="users-body"></tbody>
    </table>
    <form id="add-user-form">
      <h3>Add a user</h3>
      <div class="grid">
        <label>Name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>First password (12+ characters) <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
        <label class="check"><input type="checkbox" name="is_admin"> Admin (can manage users)</label>
      </div>
      <p class="error" role="alert" hidden></p>
      <div class="row-buttons">
        <button type="submit" class="btn primary">Add user</button>
        <button type="button" class="btn" data-close>Close</button>
      </div>
    </form>
  </div>
</dialog>
</body>
</html>
