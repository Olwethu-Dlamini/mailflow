<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MailFlow</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="brand">MailFlow</span>
  <span id="need-reply" class="meta"></span>
  <span id="p1-count" class="p1-pill" hidden></span>
  <span id="total" class="meta"></span>
  <span class="spacer"></span>
  <button id="refresh" class="btn ghost" type="button" title="Refresh now">↻ Refresh</button>
  <span id="me" class="meta"></span>
  <button id="open-users" class="btn ghost" type="button" hidden>Users</button>
  <button id="open-password" class="btn ghost" type="button">Change password</button>
  <button id="logout" class="btn ghost" type="button">Log out</button>
</header>

<div class="panes" id="panes">
  <nav class="sidebar" id="sidebar" aria-label="Views and filters"></nav>
  <section class="list" id="list" aria-label="Emails"></section>
  <section class="detail" id="detail" aria-label="Open email">
    <p class="placeholder">Pick an email from the list.</p>
  </section>
</div>

<p id="toast" class="toast" role="status" hidden></p>

<dialog id="password-dialog">
  <form id="password-form" method="dialog">
    <h2>Change password</h2>
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password (at least 12 characters) <input type="password" name="new" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input type="password" name="again" autocomplete="new-password" minlength="12" required></label>
    <p class="error" role="alert" hidden></p>
    <div class="row-buttons">
      <button type="submit" class="btn primary" value="save">Save</button>
      <button type="button" class="btn" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="users-dialog">
  <div class="dialog-body">
    <h2>Users</h2>
    <table class="users">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody id="users-body"></tbody>
    </table>
    <form id="add-user-form">
      <h3>Add a user</h3>
      <div class="grid">
        <label>Name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>First password (12+ characters) <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
        <label class="check"><input type="checkbox" name="is_admin"> Admin (can manage users)</label>
      </div>
      <p class="error" role="alert" hidden></p>
      <div class="row-buttons">
        <button type="submit" class="btn primary">Add user</button>
        <button type="button" class="btn" data-close>Close</button>
      </div>
    </form>
  </div>
</dialog>
</body>
</html>
