[project]
name = "mailflow"
version = "0.1.0"
description = "MailFlow web app: the staff page in front of the n8n engine."
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[project.scripts]
mailflow = "mailflow.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
