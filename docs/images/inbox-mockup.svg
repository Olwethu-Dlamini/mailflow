<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="600" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="20" y="20" width="1160" height="56" rx="12" fill="#111827"/>
  <text x="44" y="56" font-size="22" font-weight="bold" fill="#ffffff">MailFlow</text>
  <text x="170" y="55" font-size="15" fill="#9ca3af">all company mailboxes · 128 open</text>
  <rect x="820" y="34" width="340" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="836" y="54" font-size="14" fill="#9ca3af">Search sender or subject…</text>

  <!-- filters -->
  <rect x="20" y="76" width="240" height="544" fill="#f9fafb"/>
  <g font-size="14" fill="#1f2937">
    <text x="40" y="110" font-size="12" font-weight="bold" fill="#6b7280">MAILBOX</text>
    <text x="40" y="134" font-weight="bold">All mailboxes  128</text>
    <text x="40" y="158">info@  41</text><text x="40" y="182">sales@ (Gmail)  33</text>
    <text x="40" y="206">accounts@ (M365)  29</text><text x="40" y="230">support@ (IMAP)  19</text><text x="40" y="254">old work (POP3)  6</text>
    <text x="40" y="294" font-size="12" font-weight="bold" fill="#6b7280">CATEGORY</text>
    <text x="40" y="318">Billing · Support · Sales</text><text x="40" y="342">Internal · Newsletter · Other</text>
    <text x="40" y="382" font-size="12" font-weight="bold" fill="#6b7280">MOOD</text>
    <circle cx="46" cy="402" r="6" fill="#ef4444"/><text x="60" y="407">Negative  7</text>
    <circle cx="46" cy="428" r="6" fill="#9ca3af"/><text x="60" y="433">Neutral  96</text>
    <circle cx="46" cy="454" r="6" fill="#22c55e"/><text x="60" y="459">Positive  25</text>
    <text x="40" y="499" font-size="12" font-weight="bold" fill="#6b7280">STATUS</text>
    <text x="40" y="523">New · Done</text>
  </g>

  <!-- list -->
  <g font-size="14">
    <rect x="260" y="76" width="460" height="86" fill="#fef2f2"/>
    <circle cx="282" cy="104" r="6" fill="#ef4444"/>
    <text x="298" y="108" font-weight="bold" fill="#111827">Sipho M. — Charged twice for November</text>
    <text x="298" y="130" font-size="13" fill="#6b7280">accounts@ · 08:41</text>
    <rect x="298" y="138" width="56" height="18" rx="9" fill="#fee2e2"/><text x="306" y="151" font-size="11" fill="#b91c1c">Billing</text>
    <rect x="360" y="138" width="44" height="18" rx="9" fill="#fecaca"/><text x="368" y="151" font-size="11" fill="#b91c1c">High</text>
    <line x1="260" y1="162" x2="720" y2="162" stroke="#e5e7eb"/>
    <circle cx="282" cy="190" r="6" fill="#22c55e"/>
    <text x="298" y="194" font-weight="bold" fill="#111827">Lerato K. — Quote for 20 office routers</text>
    <text x="298" y="216" font-size="13" fill="#6b7280">sales@ · 08:12</text>
    <rect x="298" y="224" width="48" height="18" rx="9" fill="#dbeafe"/><text x="306" y="237" font-size="11" fill="#1d4ed8">Sales</text>
    <line x1="260" y1="248" x2="720" y2="248" stroke="#e5e7eb"/>
    <circle cx="282" cy="276" r="6" fill="#22c55e"/>
    <text x="298" y="280" fill="#111827">Nomsa D. — Re: connection problem</text>
    <text x="298" y="302" font-size="13" fill="#6b7280">support@ · 07:58</text>
    <rect x="298" y="310" width="60" height="18" rx="9" fill="#dcfce7"/><text x="306" y="323" font-size="11" fill="#15803d">Support</text>
    <line x1="260" y1="334" x2="720" y2="334" stroke="#e5e7eb"/>
    <circle cx="282" cy="362" r="6" fill="#9ca3af"/>
    <text x="298" y="366" fill="#6b7280">Supplier News — November newsletter</text>
    <text x="298" y="388" font-size="13" fill="#9ca3af">info@ · 06:30 · sorted by a rule, no AI</text>
    <line x1="260" y1="400" x2="720" y2="400" stroke="#e5e7eb"/>
  </g>
  <line x1="720" y1="76" x2="720" y2="620" stroke="#e5e7eb"/>

  <!-- detail -->
  <g font-size="14" fill="#111827">
    <text x="744" y="112" font-size="20" font-weight="bold">Charged twice for November</text>
    <text x="744" y="138" fill="#6b7280">Sipho Mamba &lt;sipho@example.com&gt; → accounts@</text>
    <rect x="744" y="154" width="412" height="60" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="760" y="178" font-size="13" fill="#5b21b6">AI: Billing · Negative · High urgency</text>
    <text x="760" y="200" font-size="13" fill="#5b21b6">"Card debited twice for INV-2291; refund one today."</text>
    <text x="744" y="248">Hi, my card was debited twice for the</text>
    <text x="744" y="270">November invoice (INV-2291). This is the</text>
    <text x="744" y="292">second time this happens. Please refund</text>
    <text x="744" y="314">one payment today, I need that money.</text>
    <rect x="744" y="560" width="150" height="38" rx="8" fill="#16a34a"/>
    <text x="772" y="584" font-size="15" fill="#ffffff">Mark as done</text>
    <rect x="910" y="560" width="246" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="928" y="584" font-size="15" fill="#374151">Reply in accounts@ mailbox</text>
  </g>
</svg>
