<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="30" y="48" font-size="28" font-weight="bold" fill="#111827">MailFlow: how it fits together</text>
  <text x="30" y="76" font-size="16" fill="#6b7280">New mail is collected, sorted by rules and a local AI, and shown to your team in one web app.</text>

  <!-- column headings -->
  <g font-size="13" font-weight="bold" fill="#6b7280">
    <text x="30" y="122">MAILBOXES</text>
    <text x="250" y="122" fill="#5925dc">n8n · COLLECT</text>
    <text x="460" y="122" fill="#5925dc">n8n · SORT</text>
    <text x="750" y="122" fill="#026aa2">DATA</text>
    <text x="970" y="122" fill="#2563eb">WEB APP</text>
    <text x="1190" y="122">PEOPLE</text>
  </g>

  <!-- mailboxes -->
  <g font-size="15" fill="#111827">
    <rect x="30" y="140" width="180" height="64" rx="10" fill="#f6f7f9" stroke="#d9dce1"/>
    <text x="46" y="168" font-weight="bold">Gmail</text><text x="46" y="190" font-size="13" fill="#6b7280">IMAP, app password</text>
    <rect x="30" y="220" width="180" height="64" rx="10" fill="#f6f7f9" stroke="#d9dce1"/>
    <text x="46" y="248" font-weight="bold">22112002.xyz</text><text x="46" y="270" font-size="13" fill="#6b7280">self-hosted, IMAP</text>
    <rect x="30" y="300" width="180" height="64" rx="10" fill="#ffffff" stroke="#d9dce1" stroke-dasharray="6 4"/>
    <text x="46" y="328" fill="#6b7280">Microsoft 365</text><text x="46" y="350" font-size="13" fill="#6b7280">later</text>
    <rect x="30" y="380" width="180" height="64" rx="10" fill="#ffffff" stroke="#d9dce1" stroke-dasharray="6 4"/>
    <text x="46" y="408" fill="#6b7280">POP3</text><text x="46" y="430" font-size="13" fill="#6b7280">later</text>
  </g>

  <!-- collectors -->
  <rect x="250" y="140" width="170" height="304" rx="12" fill="#f4f3ff" stroke="#d9dce1"/>
  <g font-size="15" fill="#111827">
    <text x="266" y="168" font-weight="bold" fill="#5925dc">Collectors</text>
    <rect x="264" y="184" width="142" height="44" rx="8" fill="#ffffff" stroke="#d9dce1"/><text x="278" y="211">From Gmail</text>
    <rect x="264" y="240" width="142" height="44" rx="8" fill="#ffffff" stroke="#d9dce1"/><text x="278" y="267">From 22112002</text>
    <g font-size="13" fill="#6b7280"><text x="266" y="320">One small workflow</text><text x="266" y="338">per mailbox. Reads</text><text x="266" y="356">new mail, leaves it</text><text x="266" y="374">unread, hands it on</text><text x="266" y="392">in one common shape.</text></g>
  </g>

  <!-- process -->
  <rect x="460" y="140" width="250" height="304" rx="12" fill="#f4f3ff" stroke="#d9dce1"/>
  <g font-size="15" fill="#111827">
    <text x="476" y="168" font-weight="bold" fill="#5925dc">Process email</text>
    <rect x="474" y="184" width="222" height="56" rx="8" fill="#ffffff" stroke="#d9dce1"/>
    <text x="488" y="207">1. Rules</text><text x="488" y="227" font-size="13" fill="#6b7280">newsletters, platform notices</text>
    <rect x="474" y="252" width="222" height="56" rx="8" fill="#ffffff" stroke="#d9dce1"/>
    <text x="488" y="275">2. AI (local)</text><text x="488" y="295" font-size="13" fill="#6b7280">topic, priority, summary</text>
    <rect x="474" y="320" width="222" height="56" rx="8" fill="#ffffff" stroke="#d9dce1"/>
    <text x="488" y="343">3. Save</text><text x="488" y="363" font-size="13" fill="#6b7280">one row per email</text>
    <text x="476" y="400" font-size="13" fill="#6b7280">AI answer unusable? Saved</text>
    <text x="476" y="418" font-size="13" fill="#6b7280">anyway as "Not sorted".</text>
  </g>

  <!-- data -->
  <rect x="750" y="140" width="180" height="304" rx="12" fill="#f0f9ff" stroke="#d9dce1"/>
  <g font-size="15" fill="#111827">
    <text x="766" y="168" font-weight="bold" fill="#026aa2">Data table</text>
    <text x="766" y="190" font-size="13" fill="#6b7280">"MailFlow emails"</text>
    <g font-size="13" fill="#111827"><text x="766" y="222">sender, subject, text</text><text x="766" y="242">topic, sender role</text><text x="766" y="262">priority P1–P3</text><text x="766" y="282">needs reply</text><text x="766" y="302">summary, next step</text></g>
    <text x="766" y="336" font-size="13" font-weight="bold" fill="#026aa2">status</text>
    <text x="766" y="356" font-size="13">open → waiting → done</text>
  </g>

  <!-- web app -->
  <rect x="970" y="140" width="180" height="304" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-size="15" fill="#111827">
    <text x="986" y="168" font-weight="bold" fill="#2563eb">MailFlow web app</text>
    <g font-size="13" fill="#111827"><text x="986" y="200">Inbox sorted by</text><text x="986" y="218">priority and topic</text><text x="986" y="248">Mark waiting / done</text><text x="986" y="278">Reply from the app</text><text x="986" y="308">One login per person;</text><text x="986" y="326">admins add users</text></g>
  </g>

  <!-- team -->
  <rect x="1190" y="230" width="180" height="120" rx="12" fill="#f6f7f9" stroke="#d9dce1"/>
  <text x="1206" y="282" font-size="16" font-weight="bold" fill="#111827">Your team</text>
  <text x="1206" y="306" font-size="13" fill="#6b7280">browser, phone</text>

  <!-- main arrows -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="210" y1="206" x2="248" y2="206"/><line x1="210" y1="252" x2="248" y2="252"/>
    <line x1="420" y1="290" x2="458" y2="290"/>
    <line x1="710" y1="290" x2="748" y2="290"/>
    <line x1="930" y1="290" x2="968" y2="290"/>
    <line x1="1150" y1="290" x2="1188" y2="290"/>
  </g>

  <!-- telegram -->
  <line x1="585" y1="444" x2="585" y2="508" stroke="#6b7280" stroke-width="2" marker-end="url(#g)"/>
  <rect x="460" y="510" width="250" height="60" rx="10" fill="#ffffff" stroke="#d9dce1"/>
  <text x="476" y="537" font-size="15" font-weight="bold" fill="#111827">P1 alert → Telegram</text>
  <text x="476" y="557" font-size="13" fill="#6b7280">urgent mail pings your phone</text>

  <!-- reply loop -->
  <text x="1076" y="500" font-size="13" fill="#6b7280">reply</text>
  <path d="M1060,444 L1060,640 L932,640" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="750" y="610" width="180" height="60" rx="10" fill="#f4f3ff" stroke="#d9dce1"/>
  <text x="766" y="637" font-size="15" font-weight="bold" fill="#5925dc">n8n Reply</text>
  <text x="766" y="657" font-size="13" fill="#6b7280">sets status: waiting</text>
  <line x1="750" y1="640" x2="712" y2="640" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <rect x="460" y="610" width="250" height="60" rx="10" fill="#f6f7f9" stroke="#d9dce1"/>
  <text x="476" y="637" font-size="15" font-weight="bold" fill="#111827">Gmail thread</text>
  <text x="476" y="657" font-size="13" fill="#6b7280">answer lands in the same thread</text>

  <line x1="30" y1="700" x2="1370" y2="700" stroke="#d9dce1"/>
  <text x="30" y="732" font-size="15" fill="#6b7280">Mail stays in your mailboxes; MailFlow keeps a copy to show and sort. The AI runs on our own server.</text>
</svg>
