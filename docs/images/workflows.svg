<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="bold" fill="#1f2937">The n8n workflows you will build</text>
  <text x="40" y="76" font-size="16" fill="#6b7280">Names start with "MailFlow ·" so n8n lists them together. Lesson numbers in brackets.</text>

  <g font-size="15">
    <text x="40" y="124" font-size="14" font-weight="bold" fill="#374151">COLLECTORS — one per mailbox</text>
    <rect x="40" y="138" width="330" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="56" y="171">MailFlow · From work mail (POP3)  [L3]</text>
    <rect x="40" y="204" width="330" height="54" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="56" y="237">MailFlow · From support@ (IMAP)  [L4]</text>
    <rect x="40" y="270" width="330" height="54" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="56" y="303">MailFlow · From sales@ (Gmail)  [L7]</text>
    <rect x="40" y="336" width="330" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="56" y="369">MailFlow · From accounts@ (M365)  [L8]</text>
    <rect x="40" y="402" width="330" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="56" y="435" fill="#6b7280">MailFlow · From … (copy one, new login)</text>

    <rect x="460" y="220" width="300" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="478" y="256" font-size="17" font-weight="bold" fill="#4c1d95">MailFlow · Process email</text>
    <text x="478" y="282" fill="#1f2937">the shared brain  [L2]</text>
    <text x="478" y="308" font-size="13" fill="#6b7280">dedupe → rules → AI → save → alert</text>

    <text x="840" y="124" font-size="14" font-weight="bold" fill="#374151">TABLE, PAGES AND SIDE JOBS</text>
    <rect x="840" y="138" width="320" height="54" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="856" y="171">Data table: MailFlow emails  [L1]</text>
    <rect x="840" y="204" width="320" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="856" y="237">MailFlow · Inbox page  [L5]</text>
    <rect x="840" y="270" width="320" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="856" y="303">MailFlow · Email page + status  [L6]</text>
    <rect x="840" y="336" width="320" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af"/><text x="856" y="369">MailFlow · Errors (Telegram)  [L9]</text>
    <rect x="840" y="402" width="320" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af"/><text x="856" y="435">MailFlow · Cleanup (nightly)  [L9]</text>
  </g>
  <g stroke="#7c3aed" stroke-width="2" marker-end="url(#a)">
    <line x1="370" y1="165" x2="456" y2="250"/><line x1="370" y1="231" x2="456" y2="266"/>
    <line x1="370" y1="297" x2="456" y2="282"/><line x1="370" y1="363" x2="456" y2="298"/>
    <line x1="370" y1="429" x2="456" y2="314"/>
  </g>
  <line x1="760" y1="250" x2="836" y2="170" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="772" y="196" font-size="12" fill="#0891b2">writes</text>
  <text x="840" y="482" font-size="13" fill="#6b7280">The two pages read the table;</text>
  <text x="840" y="500" font-size="13" fill="#6b7280">Cleanup deletes rows older than 90 days.</text>
  <text x="40" y="530" font-size="14" fill="#6b7280">Adding a mailbox later = duplicate a collector, give it the new login, save. Process email, the table and the pages do not change.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
</svg>
