<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="bold" fill="#1f2937">Rollout: one working piece at a time</text>
  <line x1="60" y1="140" x2="1150" y2="140" stroke="#d1d5db" stroke-width="4"/>
  <g font-size="14" fill="#1f2937">
    <circle cx="100" cy="140" r="16" fill="#6b7280"/><text x="94" y="145" fill="#fff" font-weight="bold">0</text>
    <text x="40" y="190" font-weight="bold">Prepare</text>
    <text x="40" y="212" font-size="13" fill="#6b7280">mailbox list, email types,</text>
    <text x="40" y="230" font-size="13" fill="#6b7280">AI choice, logins</text>

    <circle cx="300" cy="140" r="16" fill="#7c3aed"/><text x="294" y="145" fill="#fff" font-weight="bold">1</text>
    <text x="230" y="190" font-weight="bold">First mailbox</text>
    <text x="230" y="212" font-size="13" fill="#6b7280">table + Process email +</text>
    <text x="230" y="230" font-size="13" fill="#6b7280">work mail (L1–L3)</text>

    <circle cx="500" cy="140" r="16" fill="#22c55e"/><text x="494" y="145" fill="#fff" font-weight="bold">2</text>
    <text x="430" y="190" font-weight="bold">IMAP mailboxes</text>
    <text x="430" y="212" font-size="13" fill="#6b7280">one collector each (L4)</text>

    <circle cx="700" cy="140" r="16" fill="#16a34a"/><text x="694" y="145" fill="#fff" font-weight="bold">3</text>
    <text x="630" y="190" font-weight="bold">Inbox page</text>
    <text x="630" y="212" font-size="13" fill="#6b7280">list, filters, email,</text>
    <text x="630" y="230" font-size="13" fill="#6b7280">status buttons (L5–L6)</text>

    <circle cx="900" cy="140" r="16" fill="#3b82f6"/><text x="894" y="145" fill="#fff" font-weight="bold">4</text>
    <text x="830" y="190" font-weight="bold">Gmail + Microsoft</text>
    <text x="830" y="212" font-size="13" fill="#6b7280">logins set up first</text>
    <text x="830" y="230" font-size="13" fill="#6b7280">(L7–L8)</text>

    <circle cx="1100" cy="140" r="16" fill="#111827"/><text x="1094" y="145" fill="#fff" font-weight="bold">5</text>
    <text x="1020" y="190" font-weight="bold">Go live</text>
    <text x="1020" y="212" font-size="13" fill="#6b7280">alerts, cleanup,</text>
    <text x="1020" y="230" font-size="13" fill="#6b7280">checklist (L9–L10)</text>
  </g>
  <rect x="40" y="290" width="1120" height="90" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="322" font-size="15" font-weight="bold" fill="#374151">Later (not in the first version)</text>
  <text x="60" y="350" font-size="14" fill="#6b7280">reply from the page · assign an email to a person · team logins · daily summary on Telegram · attachments</text>
</svg>
